plugins {
    id "java"
    id "fabric-loom" version "1.10.5"
    id "com.modrinth.minotaur" version "2.+"
}

// ===== Project Info =====
group = findProperty("group") ?: "net.fugginbeenus.notchcurrency"
version = findProperty("version") ?: "0.1.0"

base {
    archivesName = (findProperty("archives_base_name") ?: "notchcurrency").toString()
}

// ===== Java Configuration =====
java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

// ===== Repositories =====
repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

// ===== Dependencies =====
dependencies {
    // Minecraft & Fabric
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    mappings "net.fabricmc:yarn:${property('yarn_mappings')}:v2"
    modImplementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_api_version')}"

    // Local mod dependencies (place jars in /libs folder)
    // Using runtimeOnly to avoid remapping issues with pre-compiled mods
    fileTree(dir: 'libs', include: '*.jar').each { file ->
        runtimeOnly files(file)
    }

    // Optional dependencies (uncomment as needed)
    // modImplementation("com.terraformersmc:modmenu:${property('modmenu_version')}") { transitive = false }
    // modImplementation("me.shedaniel.cloth:cloth-config-fabric:${property('cloth_config_version')}") {
    //     exclude group: "net.fabricmc.fabric-api"
    // }
}

// ===== Loom Configuration =====
loom {
    splitEnvironmentSourceSets()

    runs {
        client {
            client()
            name "Minecraft Client"
            runDir "run"
        }
        clientA {
            client()
            name "Client A (Multiplayer Test)"
            programArgs "--username", "PlayerA"
            runDir "runs/clientA"
        }
        clientB {
            client()
            name "Client B (Multiplayer Test)"
            programArgs "--username", "PlayerB"
            runDir "runs/clientB"
        }
        server {
            server()
            name "Dedicated Server"
            runDir "runs/server"
        }
    }
}

// ===== Build Tasks =====
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

tasks.processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand("version": project.version)
    }
}

tasks.jar {
    from("LICENSE") { rename { "${it}_${base.archivesName.get()}" } }
    manifest {
        attributes(
                "Implementation-Title": base.archivesName.get(),
                "Implementation-Version": version,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        )
    }
}

// ===== Modrinth Publishing =====
// Creates a unique build stamp to prevent "duplicate file" errors
def stampFile = layout.buildDirectory.file("tmp/modrinth-stamp.txt")

tasks.register("generateModrinthStamp") {
    outputs.file(stampFile)
    doLast {
        def f = stampFile.get().asFile
        f.parentFile.mkdirs()
        f.text = "build-id=${UUID.randomUUID()}\ntimestamp=${System.currentTimeMillis()}\n"
    }
}

tasks.register("stampedJar", Jar) {
    dependsOn(tasks.remapJar, "generateModrinthStamp")

    from(zipTree(tasks.remapJar.archiveFile)) {
        exclude("fabric.mod.json")
    }
    from(layout.buildDirectory.dir("resources/main")) {
        include("fabric.mod.json")
    }
    from(stampFile) {
        into("META-INF")
        rename { "build.stamp" }
    }

    destinationDirectory = layout.buildDirectory.dir("libs")
    archiveBaseName = base.archivesName.get()
    archiveVersion = version.toString()
    archiveClassifier = "modrinth"

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = findProperty("modrinth_project") ?: "gGHT7Irr"
    versionNumber = version.toString()
    versionName = "Notch Currency ${version}"
    versionType = findProperty("modrinth_release_type") ?: "release"
    uploadFile = tasks.named("stampedJar").flatMap { it.archiveFile }
    gameVersions = [property("minecraft_version").toString()]
    loaders = ["fabric"]

    def changelogFile = file("changelogs/${version}.md")
    changelog = changelogFile.exists() ? changelogFile.text : "See commits for changes."

    dependencies {
        required.project "fabric-api"
    }
}

tasks.modrinth {
    dependsOn("stampedJar")
}